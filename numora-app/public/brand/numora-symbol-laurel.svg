<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Numora">
  <defs>
    <linearGradient id="numoraGoldLaurel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5DE9E"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Aro externo dourado -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#numoraGoldLaurel)" stroke-width="4"/>

  <!-- Borda de moeda (16 marcas) -->
  <g fill="url(#numoraGoldLaurel)">
    <circle cx="100.0" cy="12.0" r="2.8"/>
    <circle cx="133.7" cy="18.7" r="2.8"/>
    <circle cx="162.2" cy="37.8" r="2.8"/>
    <circle cx="181.3" cy="66.3" r="2.8"/>
    <circle cx="188.0" cy="100.0" r="2.8"/>
    <circle cx="181.3" cy="133.7" r="2.8"/>
    <circle cx="162.2" cy="162.2" r="2.8"/>
    <circle cx="133.7" cy="181.3" r="2.8"/>
    <circle cx="100.0" cy="188.0" r="2.8"/>
    <circle cx="66.3" cy="181.3" r="2.8"/>
    <circle cx="37.8" cy="162.2" r="2.8"/>
    <circle cx="18.7" cy="133.7" r="2.8"/>
    <circle cx="12.0" cy="100.0" r="2.8"/>
    <circle cx="18.7" cy="66.3" r="2.8"/>
    <circle cx="37.8" cy="37.8" r="2.8"/>
    <circle cx="66.3" cy="18.7" r="2.8"/>
  </g>

  <!-- Disco interno navy -->
  <circle cx="100" cy="100" r="80" fill="#0B1F3B"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#numoraGoldLaurel)" stroke-width="1.6" opacity="0.85"/>

  <!-- Ramos de louro — 5 folhas de cada lado, concentrados no terço
       inferior (perto do aro, longe do N), lendo como dois ramos
       distintos em vez de um efeito "estrela". -->
  <g fill="url(#numoraGoldLaurel)">
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(87.85,168.94) rotate(-170)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(70.42,163.44) rotate(-155)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(55.0,153.62) rotate(-140)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(42.66,140.15) rotate(-125)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(34.22,123.94) rotate(-110)"/>

    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(112.15,168.94) rotate(170)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(129.58,163.44) rotate(155)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(145.0,153.62) rotate(140)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(157.34,140.15) rotate(125)"/>
    <path d="M0,0 C6,7 6,19 0,26 C-6,19 -6,7 0,0 Z" transform="translate(165.78,123.94) rotate(110)"/>
  </g>

  <!-- Monograma N -->
  <g transform="translate(67,64)" fill="url(#numoraGoldLaurel)">
    <rect x="0" y="0" width="18" height="72"/>
    <rect x="48" y="0" width="18" height="72"/>
    <polygon points="18,0 36,0 66,72 48,72"/>
  </g>
</svg>
