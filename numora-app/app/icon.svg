<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Numora">
  <defs>
    <linearGradient id="numoraGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5DE9E"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Aro externo dourado -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#numoraGold)" stroke-width="4"/>

  <!-- Borda de moeda simplificada (16 marcas, não 32) -->
  <g fill="url(#numoraGold)">
    <circle cx="100.0" cy="12.0" r="2.8"/>
    <circle cx="133.7" cy="18.7" r="2.8"/>
    <circle cx="162.2" cy="37.8" r="2.8"/>
    <circle cx="181.3" cy="66.3" r="2.8"/>
    <circle cx="188.0" cy="100.0" r="2.8"/>
    <circle cx="181.3" cy="133.7" r="2.8"/>
    <circle cx="162.2" cy="162.2" r="2.8"/>
    <circle cx="133.7" cy="181.3" r="2.8"/>
    <circle cx="100.0" cy="188.0" r="2.8"/>
    <circle cx="66.3" cy="181.3" r="2.8"/>
    <circle cx="37.8" cy="162.2" r="2.8"/>
    <circle cx="18.7" cy="133.7" r="2.8"/>
    <circle cx="12.0" cy="100.0" r="2.8"/>
    <circle cx="18.7" cy="66.3" r="2.8"/>
    <circle cx="37.8" cy="37.8" r="2.8"/>
    <circle cx="66.3" cy="18.7" r="2.8"/>
  </g>

  <!-- Disco interno navy -->
  <circle cx="100" cy="100" r="80" fill="#0B1F3B"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#numoraGold)" stroke-width="1.6" opacity="0.85"/>

  <!-- Monograma N — mais robusto para legibilidade em 16/32px -->
  <g transform="translate(67,64)" fill="url(#numoraGold)">
    <rect x="0" y="0" width="18" height="72"/>
    <rect x="48" y="0" width="18" height="72"/>
    <polygon points="18,0 36,0 66,72 48,72"/>
  </g>
</svg>
