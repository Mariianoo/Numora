# components/responses.yaml
# Respostas de erro padronizadas — reutilizadas via $ref em todo endpoint.
# Corpo sempre no formato components/schemas.yaml#Error (API_CONVENTIONS.md §11).

BadRequest:
  description: Requisição inválida — falha de validação de schema/regra de negócio.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: VALIDATION_ERROR
          message: "O campo 'name' é obrigatório."
          details: [{ field: name, issue: required }]

Unauthorized:
  description: Ausência ou invalidade do access token.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: UNAUTHORIZED
          message: "Token de acesso ausente, inválido ou expirado."

Forbidden:
  description: Autenticado, mas sem permissão para a ação/recurso.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: FORBIDDEN
          message: "Você não tem permissão para executar esta ação."

NotFound:
  description: Recurso não encontrado (ou não visível para o solicitante — RLS).
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: NOT_FOUND
          message: "Recurso não encontrado."

Conflict:
  description: "Conflito de estado (ex.: unicidade violada, transição de status inválida)."
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: CONFLICT
          message: "Já existe um recurso com esses dados."

TooManyRequests:
  description: Limite de requisições excedido (ver API_CONVENTIONS.md §10).
  headers:
    X-RateLimit-Limit: { schema: { type: integer } }
    X-RateLimit-Remaining: { schema: { type: integer } }
    X-RateLimit-Reset: { schema: { type: integer } }
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: RATE_LIMITED
          message: "Muitas requisições. Tente novamente em instantes."

InternalError:
  description: Erro inesperado no servidor.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
      example:
        error:
          code: INTERNAL_ERROR
          message: "Erro inesperado. Nossa equipe já foi notificada."
