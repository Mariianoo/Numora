# components/schemas.yaml
# Schemas reutilizados via $ref em todo o contrato. Nomes espelham as tabelas
# de DATABASE_ARCHITECTURE.md; campos internos/sensíveis (ex.: service_role,
# dados de RLS) nunca são expostos aqui.

Error:
  type: object
  required: [error]
  properties:
    error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: "O campo 'name' é obrigatório."
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

Pagination:
  type: object
  required: [next_cursor, has_more, limit]
  properties:
    next_cursor: { type: [string, "null"] }
    has_more: { type: boolean }
    limit: { type: integer }

# ---------------------------------------------------------------------------
# Authentication

AuthTokens:
  type: object
  required: [access_token, refresh_token, expires_in, token_type]
  properties:
    access_token: { type: string }
    refresh_token: { type: string }
    expires_in: { type: integer, example: 3600 }
    token_type: { type: string, example: Bearer }

RegisterRequest:
  type: object
  required: [email, password, username, display_name]
  properties:
    email: { type: string, format: email }
    password: { type: string, minLength: 10 }
    username: { type: string, minLength: 3, maxLength: 30 }
    display_name: { type: string, minLength: 1, maxLength: 80 }
    locale: { type: string, default: pt-BR }

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email: { type: string, format: email }
    password: { type: string }
    mfa_code: { type: string, description: "Obrigatório se MFA estiver habilitado." }

# ---------------------------------------------------------------------------
# Users / Profiles

UserRole:
  type: string
  enum: [visitor, user, verified_seller, moderator, admin, system, ai]

SubscriptionTier:
  type: string
  enum: [free, premium, pro]

Profile:
  type: object
  properties:
    id: { type: string, format: uuid }
    username: { type: string }
    display_name: { type: string }
    avatar_url: { type: [string, "null"], format: uri }
    bio: { type: [string, "null"] }
    country_code: { type: [string, "null"] }
    is_verified_seller: { type: boolean }
    created_at: { type: string, format: date-time }

ProfilePrivate:
  allOf:
    - $ref: '#/Profile'
    - type: object
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/UserRole' }
        plan_tier: { $ref: '#/SubscriptionTier' }
        locale: { type: string }
        last_active_at: { type: [string, "null"], format: date-time }

ProfileUpdateRequest:
  type: object
  properties:
    display_name: { type: string, minLength: 1, maxLength: 80 }
    bio: { type: string, maxLength: 500 }
    country_code: { type: string, minLength: 2, maxLength: 2 }
    locale: { type: string }

UserDevice:
  type: object
  properties:
    id: { type: string, format: uuid }
    device_type: { type: string, enum: [web, ios, android, desktop] }
    device_name: { type: [string, "null"] }
    last_seen_at: { type: string, format: date-time }

UserSession:
  type: object
  properties:
    id: { type: string, format: uuid }
    device_id: { type: [string, "null"], format: uuid }
    ip_address: { type: string }
    user_agent: { type: string }
    created_at: { type: string, format: date-time }
    expires_at: { type: string, format: date-time }
    is_current: { type: boolean }

# ---------------------------------------------------------------------------
# Collections

ItemVisibility:
  type: string
  enum: [private, collection_only, public]

Collection:
  type: object
  properties:
    id: { type: string, format: uuid }
    owner_id: { type: string, format: uuid }
    name: { type: string }
    description: { type: [string, "null"] }
    is_public: { type: boolean }
    cover_photo_url: { type: [string, "null"], format: uri }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

CollectionCreateRequest:
  type: object
  required: [name]
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    description: { type: string, maxLength: 1000 }
    is_public: { type: boolean, default: false }

CollectionUpdateRequest:
  type: object
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    description: { type: string, maxLength: 1000 }
    is_public: { type: boolean }
    cover_photo_path: { type: string }

CollectionItem:
  type: object
  properties:
    id: { type: string, format: uuid }
    owner_id: { type: string, format: uuid }
    collection_id: { type: [string, "null"], format: uuid }
    catalog_item_id: { type: [string, "null"], format: uuid }
    custom_name: { type: [string, "null"] }
    condition_grade: { type: [string, "null"] }
    acquisition_date: { type: [string, "null"], format: date }
    acquisition_price: { type: [number, "null"] }
    acquisition_currency: { type: string, example: BRL }
    estimated_value: { type: [number, "null"] }
    notes: { type: [string, "null"] }
    is_for_trade: { type: boolean }
    visibility: { $ref: '#/ItemVisibility' }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }

CollectionItemCreateRequest:
  type: object
  properties:
    collection_id: { type: string, format: uuid }
    catalog_item_id: { type: string, format: uuid }
    custom_name: { type: string, maxLength: 160 }
    condition_grade: { type: string }
    acquisition_date: { type: string, format: date }
    acquisition_price: { type: number }
    acquisition_currency: { type: string, default: BRL }
    notes: { type: string, maxLength: 2000 }
    is_for_trade: { type: boolean, default: false }
    visibility: { $ref: '#/ItemVisibility' }
  description: >
    Exige catalog_item_id OU custom_name (constraint chk_collection_items_name
    do banco — ver DATABASE.md).

CollectionItemUpdateRequest:
  type: object
  properties:
    collection_id: { type: [string, "null"], format: uuid }
    custom_name: { type: string, maxLength: 160 }
    condition_grade: { type: string }
    acquisition_date: { type: string, format: date }
    acquisition_price: { type: number }
    estimated_value: { type: number }
    notes: { type: string, maxLength: 2000 }
    is_for_trade: { type: boolean }
    visibility: { $ref: '#/ItemVisibility' }
