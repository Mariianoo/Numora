# components/parameters.yaml
# Parâmetros comuns reutilizados via $ref (API_CONVENTIONS.md §4-§7).

LimitParam:
  name: limit
  in: query
  description: Itens por página (máx. 100).
  required: false
  schema: { type: integer, default: 20, minimum: 1, maximum: 100 }

CursorParam:
  name: cursor
  in: query
  description: Cursor opaco retornado por `pagination.next_cursor` na página anterior.
  required: false
  schema: { type: string }

SortParam:
  name: sort
  in: query
  description: >
    Campos de ordenação separados por vírgula; prefixo `-` para decrescente.
    Campos válidos declarados na descrição de cada endpoint.
  required: false
  schema: { type: string }
  example: "-created_at"

SearchParam:
  name: q
  in: query
  description: Termo de busca textual livre.
  required: false
  schema: { type: string }

IdempotencyKeyHeader:
  name: Idempotency-Key
  in: header
  description: Chave opcional para evitar duplicação em requisições de escrita sensíveis.
  required: false
  schema: { type: string, format: uuid }
