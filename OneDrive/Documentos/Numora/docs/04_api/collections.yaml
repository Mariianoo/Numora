# paths/collections.yaml
# Tag: Collections — coleções e itens do colecionador autenticado.

list:
  get:
    tags: [Collections]
    summary: Lista as coleções do usuário autenticado.
    x-permissions: "Usuário autenticado (apenas as próprias coleções)."
    x-rate-limit: "60 requisições / minuto / usuário."
    parameters:
      - $ref: '../components/parameters.yaml#/LimitParam'
      - $ref: '../components/parameters.yaml#/CursorParam'
      - $ref: '../components/parameters.yaml#/SortParam'
      - name: filter[is_public]
        in: query
        schema: { type: boolean }
    responses:
      '200':
        description: Lista paginada de coleções.
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: array, items: { $ref: '../components/schemas.yaml#/Collection' } }
                pagination: { $ref: '../components/schemas.yaml#/Pagination' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  post:
    tags: [Collections]
    summary: Cria uma nova coleção.
    x-permissions: "Usuário autenticado."
    x-rate-limit: "30 requisições / hora / usuário."
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/CollectionCreateRequest' }
          example: { name: "Moedas do Brasil Império", description: "Peças de 1822 a 1889.", is_public: true }
    responses:
      '201':
        description: Coleção criada.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Collection' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

byId:
  get:
    tags: [Collections]
    summary: Detalha uma coleção.
    x-permissions: "Dono da coleção, ou qualquer solicitante se is_public = true (RLS collections_select_own_or_public)."
    x-rate-limit: "60 requisições / minuto / usuário."
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Dados da coleção.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Collection' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  patch:
    tags: [Collections]
    summary: Atualiza uma coleção.
    x-permissions: "Apenas o dono."
    x-rate-limit: "30 requisições / hora / usuário."
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/CollectionUpdateRequest' }
    responses:
      '200':
        description: Coleção atualizada.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Collection' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    tags: [Collections]
    summary: Remove uma coleção (soft delete — fn_soft_delete).
    description: >
      Itens vinculados (collection_items.collection_id) não são excluídos,
      apenas desassociados (on delete set null — ver DATABASE.md).
    x-permissions: "Apenas o dono."
    x-rate-limit: "20 requisições / hora / usuário."
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204': { description: Coleção removida. }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

items:
  get:
    tags: [Collections]
    summary: Lista os itens de uma coleção.
    x-permissions: "Dono da coleção, ou público se a coleção/itens forem públicos."
    x-rate-limit: "60 requisições / minuto / usuário."
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '../components/parameters.yaml#/LimitParam'
      - $ref: '../components/parameters.yaml#/CursorParam'
      - $ref: '../components/parameters.yaml#/SortParam'
      - $ref: '../components/parameters.yaml#/SearchParam'
      - name: filter[is_for_trade]
        in: query
        schema: { type: boolean }
    responses:
      '200':
        description: Lista paginada de itens.
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: array, items: { $ref: '../components/schemas.yaml#/CollectionItem' } }
                pagination: { $ref: '../components/schemas.yaml#/Pagination' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  post:
    tags: [Collections]
    summary: Adiciona um item à coleção.
    x-permissions: "Apenas o dono da coleção."
    x-rate-limit: "60 requisições / hora / usuário."
    parameters:
      - name: collectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/CollectionItemCreateRequest' }
          example:
            catalog_item_id: "9c2e1a4f-..."
            condition_grade: "MS-63"
            acquisition_date: "2025-11-02"
            acquisition_price: 350.00
            visibility: private
    responses:
      '201':
        description: Item criado.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CollectionItem' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

itemById:
  get:
    tags: [Collections]
    summary: Detalha um item de coleção.
    x-permissions: "Dono do item, ou público conforme visibility (RLS collection_items_select_visible)."
    x-rate-limit: "60 requisições / minuto / usuário."
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Dados do item.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CollectionItem' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  patch:
    tags: [Collections]
    summary: Atualiza um item de coleção.
    x-permissions: "Apenas o dono."
    x-rate-limit: "60 requisições / hora / usuário."
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/CollectionItemUpdateRequest' }
    responses:
      '200':
        description: Item atualizado.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/CollectionItem' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    tags: [Collections]
    summary: Remove um item de coleção (soft delete).
    x-permissions: "Apenas o dono."
    x-rate-limit: "30 requisições / hora / usuário."
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204': { description: Item removido. }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '409':
        description: Item vinculado a anúncio ativo (marketplace_listings) — cancele o anúncio antes de remover.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/Error' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
