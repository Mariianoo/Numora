# paths/users.yaml
# Tag: Users. Autogestão da conta (/users/me/*) + administração (/users, /users/{id}).

me:
  get:
    tags: [Users]
    summary: Retorna a conta autenticada.
    x-permissions: "Usuário autenticado (próprio registro — RLS profiles_select_own_or_public)."
    x-rate-limit: "60 requisições / minuto / usuário."
    responses:
      '200':
        description: Dados completos do próprio perfil.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ProfilePrivate' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  patch:
    tags: [Users]
    summary: Atualiza dados do próprio perfil.
    description: "Colunas role/plan_tier/is_verified_seller nunca são alteráveis por este endpoint (PROJECT_RULES.md §16.5)."
    x-permissions: "Usuário autenticado (próprio registro)."
    x-rate-limit: "20 requisições / hora / usuário."
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../components/schemas.yaml#/ProfileUpdateRequest' }
    responses:
      '200':
        description: Perfil atualizado.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ProfilePrivate' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
  delete:
    tags: [Users]
    summary: Solicita exclusão da própria conta (fluxo LGPD).
    description: >
      Não executa hard delete imediato. Marca a conta para anonimização/remoção
      conforme prazos legais de retenção (PROJECT_RULES.md §41.4) e revoga
      todas as sessões.
    x-permissions: "Usuário autenticado (próprio registro)."
    x-rate-limit: "3 requisições / dia / usuário."
    responses:
      '202':
        description: Solicitação de exclusão aceita e em processamento.
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, example: pending_deletion } } }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

myDevices:
  get:
    tags: [Users]
    summary: Lista dispositivos reconhecidos do usuário.
    x-permissions: "Usuário autenticado (próprio)."
    x-rate-limit: "30 requisições / minuto / usuário."
    parameters:
      - $ref: '../components/parameters.yaml#/LimitParam'
      - $ref: '../components/parameters.yaml#/CursorParam'
    responses:
      '200':
        description: Lista paginada de dispositivos.
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: array, items: { $ref: '../components/schemas.yaml#/UserDevice' } }
                pagination: { $ref: '../components/schemas.yaml#/Pagination' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

myDeviceById:
  delete:
    tags: [Users]
    summary: Remove um dispositivo (revoga push notifications associadas).
    x-permissions: "Usuário autenticado (dono do dispositivo)."
    x-rate-limit: "20 requisições / hora / usuário."
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204': { description: Dispositivo removido. }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

mySessions:
  get:
    tags: [Users]
    summary: Lista sessões ativas do usuário.
    x-permissions: "Usuário autenticado (próprio)."
    x-rate-limit: "30 requisições / minuto / usuário."
    parameters:
      - $ref: '../components/parameters.yaml#/LimitParam'
      - $ref: '../components/parameters.yaml#/CursorParam'
    responses:
      '200':
        description: Lista paginada de sessões.
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: array, items: { $ref: '../components/schemas.yaml#/UserSession' } }
                pagination: { $ref: '../components/schemas.yaml#/Pagination' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

mySessionById:
  delete:
    tags: [Users]
    summary: Revoga uma sessão específica.
    x-permissions: "Usuário autenticado (dono da sessão)."
    x-rate-limit: "20 requisições / hora / usuário."
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204': { description: Sessão revogada. }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminList:
  get:
    tags: [Users, Admin]
    summary: Lista usuários da plataforma (administração).
    x-permissions: "Papel admin ou moderator (campos sensíveis restritos a admin)."
    x-rate-limit: "60 requisições / minuto / usuário."
    parameters:
      - $ref: '../components/parameters.yaml#/LimitParam'
      - $ref: '../components/parameters.yaml#/CursorParam'
      - $ref: '../components/parameters.yaml#/SearchParam'
      - $ref: '../components/parameters.yaml#/SortParam'
      - name: filter[role]
        in: query
        schema: { type: string, enum: [visitor, user, verified_seller, moderator, admin] }
      - name: filter[plan_tier]
        in: query
        schema: { type: string, enum: [free, premium, pro] }
    responses:
      '200':
        description: Lista paginada de usuários.
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { type: array, items: { $ref: '../components/schemas.yaml#/ProfilePrivate' } }
                pagination: { $ref: '../components/schemas.yaml#/Pagination' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminById:
  get:
    tags: [Users, Admin]
    summary: Detalha um usuário específico (administração).
    x-permissions: "Papel admin ou moderator."
    x-rate-limit: "60 requisições / minuto / usuário."
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Dados do usuário.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ProfilePrivate' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }

adminRole:
  patch:
    tags: [Users, Admin]
    summary: Altera o papel (role) de um usuário.
    description: >
      Ação sensível — sempre gravada em audit_logs e admin_actions
      (DATABASE_ARCHITECTURE.md §6, §7). Executada via service_role.
    x-permissions: "Exclusivo do papel admin."
    x-rate-limit: "20 requisições / hora / usuário."
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [role, reason]
            properties:
              role: { $ref: '../components/schemas.yaml#/UserRole' }
              reason: { type: string, minLength: 5, description: "Motivo da alteração, registrado em admin_actions." }
    responses:
      '200':
        description: Papel atualizado.
        content:
          application/json:
            schema: { $ref: '../components/schemas.yaml#/ProfilePrivate' }
      '400': { $ref: '../components/responses.yaml#/BadRequest' }
      '401': { $ref: '../components/responses.yaml#/Unauthorized' }
      '403': { $ref: '../components/responses.yaml#/Forbidden' }
      '404': { $ref: '../components/responses.yaml#/NotFound' }
      '500': { $ref: '../components/responses.yaml#/InternalError' }
